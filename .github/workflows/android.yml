name: Build Android APK
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          
      - name: Install Python dependencies
        run: pip install -r requirements.txt
          
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.1"
          
      - name: Setup environment
        run: |
          echo "APP_ENV=prod" > .env
          echo "VERSION=${{ github.run_number }}" >> .env
          echo "BUILD=${{ github.run_number }}" >> .env
          echo "is_mobile=1" >> .env
          
      - name: Build APK with Flet
        run: |
          flet build apk \
            --project "avventura-epica" \
            --product "Avventura Epica" \
            --build-version "2.5.0" \
            --build-number ${{ github.run_number }} \
            --org "com.ambrogio.riili" \
            --company "Ambrogio Riili" \
            --flutter-build-args=--release
            
      - name: Rename APK
        run: |
          cd build/apk
          # Trova il file APK generato e rinominalo
          find . -name "*.apk" -exec mv {} AvventuraEpica.apk \;
          
      - name: Validate APK
        run: |
          cd build/apk
          
          # Verifica esistenza APK
          if [ ! -f "AvventuraEpica.apk" ]; then
            echo "❌ APK file not found"
            exit 1
          fi
          
          echo "✅ APK build successful"
          echo "📱 App size: $(ls -lh AvventuraEpica.apk | awk '{print $5}')"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AvventuraEpica-android
          path: build/apk/*.apk