name: iOS Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Install dependencies
      run: |
        # Install any CocoaPods dependencies if needed
        if [ -f "Podfile" ]; then
          pod install
        fi
    
    - name: Build iOS app
      run: |
        xcodebuild \
          -project "Avventura epica.xcodeproj" \
          -scheme "Avventura epica" \
          -destination "generic/platform=iOS" \
          -archivePath "build/Avventura_epica.xcarchive" \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Create ExportOptions.plist
      run: |
        cat > ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>compileBitcode</key>
            <false/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>-</string>
            <key>provisioningProfiles</key>
            <dict/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
        </dict>
        </plist>
        EOF
    
    - name: Create IPA from Archive
      run: |
        mkdir -p build/ipa/Payload
        
        # Find the .app file in the archive
        APP_PATH=$(find "build/Avventura_epica.xcarchive/Products/Applications" -name "*.app" | head -1)
        
        if [ -z "$APP_PATH" ]; then
          echo "❌ No .app file found in archive"
          exit 1
        fi
        
        echo "✅ Found app: $APP_PATH"
        
        # Copy app to Payload folder
        cp -r "$APP_PATH" build/ipa/Payload/
        
        # Create IPA
        cd build/ipa
        zip -r "Avventura_epica.ipa" Payload/
        
        echo "✅ IPA created successfully"
        ls -la *.ipa
    
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: Avventura-epica-unsigned
        path: build/ipa/*.ipa
        retention-days: 30
    
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          build/
          DerivedData/
        retention-days: 7