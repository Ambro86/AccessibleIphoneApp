name: Build iOS IPA (Ultra Simple)
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          
      - name: Install Python dependencies
        run: |
          pip install flet==0.28.3
          pip install -r requirements.txt
          
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.1"
          
      - name: Setup environment
        run: |
          echo "APP_ENV=prod" > .env
          echo "VERSION=${{ github.run_number }}" >> .env
          echo "BUILD=${{ github.run_number }}" >> .env
          
      - name: Build IPA with Flet
        run: |
          # Build standard con Flet
          flet build ipa \
            --project "avventura-epica" \
            --build-version "2.5.0" \
            --build-number ${{ github.run_number }} \
            --company "Ambrogio Riili"
            
      - name: Patch IPA for Accessibility
        run: |
          echo "🔍 Cercando IPA generato..."
          
          # Trova l'IPA
          IPA_FILE=$(find build -name "*.ipa" -type f | head -1)
          
          if [ -z "$IPA_FILE" ]; then
            echo "❌ Nessun file IPA trovato!"
            echo "📁 Contenuto build/:"
            find build -type f -name "*.ipa" || echo "Nessun IPA trovato"
            exit 1
          fi
          
          echo "✅ Trovato IPA: $IPA_FILE"
          
          # Crea directory temporanea per patch
          mkdir -p temp_patch
          cd temp_patch
          
          # Estrai IPA
          unzip -q "../$IPA_FILE"
          
          # Trova e patcha Info.plist
          APP_DIR=$(find Payload -name "*.app" -type d | head -1)
          if [ -n "$APP_DIR" ]; then
            INFO_PLIST="$APP_DIR/Info.plist"
            if [ -f "$INFO_PLIST" ]; then
              echo "📝 Patchando Info.plist per accessibilità..."
              /usr/libexec/PlistBuddy -c "Add :UIAccessibilityEnabled bool YES" "$INFO_PLIST" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :UIAccessibilityEnabled YES" "$INFO_PLIST"
              
              # Verifica
              echo "📋 Verifica patch:"
              /usr/libexec/PlistBuddy -c "Print :UIAccessibilityEnabled" "$INFO_PLIST" || echo "Non trovato"
            fi
          fi
          
          # Ricrea IPA
          zip -qr "../${IPA_FILE}.patched" Payload/
          cd ..
          mv "${IPA_FILE}.patched" "$IPA_FILE"
          
          # Pulisci
          rm -rf temp_patch
          
          echo "✅ IPA patchato con successo"
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AvventuraEpica-ios
          path: build/**/*.ipa