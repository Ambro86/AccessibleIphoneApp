name: Build iOS IPA (Lean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"

      - name: Setup environment
        run: |
          echo "APP_ENV=prod" > .env
          echo "VERSION=${{ github.run_number }}" >> .env
          echo "BUILD=${{ github.run_number }}" >> .env
          echo "is_mobile=1" >> .env

      - name: Build IPA with Flet
        run: |
          flet build ipa \
            --project "avventura-epica" \
            --product "Avventura Epica" \
            --build-version "2.5.0" \
            --build-number ${{ github.run_number }} \
            --org "com.ambrogio.riili" \
            --company "Ambrogio Riili" \
            --flutter-build-args=--release

      - name: Convert xcarchive to IPA + Patch Info.plist
        run: |
          mkdir -p build/ipa/Payload
          
          # Trova l'xcarchive
          XCARCHIVE_DIR=$(find build/ipa -name "*.xcarchive" -type d | head -1)
          if [ -z "$XCARCHIVE_DIR" ]; then
            echo "❌ Nessun file .xcarchive trovato!"
            exit 1
          fi
          
          # Trova il file .app
          APP_FILE=$(find "$XCARCHIVE_DIR" -name "*.app" -type d | head -1)
          if [ -z "$APP_FILE" ]; then
            echo "❌ Nessun file .app trovato!"
            exit 1
          fi

          echo "✅ App trovato: $APP_FILE"

          # Path al Info.plist
          INFO_PLIST="$APP_FILE/Info.plist"

          # Converti in XML leggibile
          plutil -convert xml1 "$INFO_PLIST"

          # Inserisci la chiave accessibilità se non presente
          if ! grep -q "<key>UIAccessibilityEnabled</key>" "$INFO_PLIST"; then
            echo "🛠️ Aggiungo UIAccessibilityEnabled a Info.plist"
            /usr/libexec/PlistBuddy -c "Add :UIAccessibilityEnabled bool true" "$INFO_PLIST" || echo "ℹ️ UIAccessibilityEnabled già presente o errore gestito"
          else
            echo "ℹ️ UIAccessibilityEnabled già presente"
          fi

          # Riconverti in formato binario
          plutil -convert binary1 "$INFO_PLIST"

          # Crea IPA
          cp -r "$APP_FILE" build/ipa/Payload/
          cd build/ipa
          zip -r AvventuraEpica.ipa Payload/
          rm -rf Payload

      - name: Validate IPA (quick check)
        run: |
          cd build/ipa

          # Verifica esistenza IPA
          if [ ! -f "AvventuraEpica.ipa" ]; then
            echo "❌ IPA file not found"
            exit 1
          fi

          # Estrai per controlli base
          unzip -q AvventuraEpica.ipa

          # Verifica struttura
          APP_IN_PAYLOAD=$(find Payload/ -name "*.app" -type d | head -1)
          if [ -z "$APP_IN_PAYLOAD" ]; then
            echo "❌ Invalid IPA structure - no .app found in Payload"
            ls -la Payload/
            exit 1
          fi

          echo "✅ Found app in payload: $APP_IN_PAYLOAD"
          echo "📱 App size: $(ls -lh AvventuraEpica.ipa | awk '{print $5}')"

          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AvventuraEpica-ios-lean
          path: build/ipa/*.ipa