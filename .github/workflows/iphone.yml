name: Build iOS IPA (Debug Mode)
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          
      - name: Install Python dependencies
        run: |
          pip install flet==0.28.3
          pip install -r requirements.txt
          
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.1"
          
      - name: Setup environment
        run: |
          echo "APP_ENV=prod" > .env
          echo "VERSION=${{ github.run_number }}" >> .env
          echo "BUILD=${{ github.run_number }}" >> .env
          # Non impostare is_mobile per ora
          
      # OPZIONE 1: Build con JIT invece di AOT (più simile a debug)
      - name: Build IPA with JIT compilation
        run: |
          # Crea prima il progetto Flutter
          flet create . \
            --project "avventura-epica" \
            --product "Avventura Epica" \
            --org "com.ambrogio.riili"
          
          # Modifica il build configuration per usare JIT
          cd ios
          
          # Aggiungi flag per preservare i simboli di debug
          echo "PRESERVE_DEAD_CODE_INITS_AND_TERMS = YES" >> Runner.xcodeproj/project.pbxproj
          echo "STRIP_INSTALLED_PRODUCT = NO" >> Runner.xcodeproj/project.pbxproj
          
          # Build con configurazione custom
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ../build/Runner.xcarchive \
            -allowProvisioningUpdates \
            GCC_OPTIMIZATION_LEVEL=0 \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            ENABLE_BITCODE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            archive
            
      # OPZIONE 2: Usa Flet con parametri speciali
      # - name: Build IPA with special Flet parameters
      #   run: |
      #     flet build ipa \
      #       --project "avventura-epica" \
      #       --product "Avventura Epica" \
      #       --build-version "2.5.0" \
      #       --build-number ${{ github.run_number }} \
      #       --org "com.ambrogio.riili" \
      #       --company "Ambrogio Riili" \
      #       --flutter-build-args="--debug --no-shrink --verbose"
            
      # OPZIONE 3: Patch del codice Dart generato
      # - name: Patch generated Dart code
      #   run: |
      #     # Prima genera il progetto
      #     flet create . \
      #       --project "avventura-epica" \
      #       --product "Avventura Epica" \
      #       --org "com.ambrogio.riili"
      #     
      #     # Trova e modifica il main.dart generato
      #     find . -name "main.dart" -type f | while read file; do
      #       echo "Patching $file for accessibility..."
      #       
      #       # Aggiungi import per semantics
      #       sed -i '' '1i\
      #       import "package:flutter/semantics.dart";\
      #       ' "$file"
      #       
      #       # Abilita semantics debugging
      #       sed -i '' '/runApp/i\
      #       WidgetsFlutterBinding.ensureInitialized();\
      #       SemanticsBinding.instance.ensureSemantics();\
      #       ' "$file"
      #     done
      #     
      #     # Ora builda
      #     cd ios
      #     flutter build ios --release --no-codesign
            
      - name: Convert xcarchive to IPA
        run: |
          mkdir -p build/ipa/Payload
          
          # Trova l'xcarchive
          if [ -f "build/Runner.xcarchive" ]; then
            XCARCHIVE_DIR="build/Runner.xcarchive"
          else
            XCARCHIVE_DIR=$(find build -name "*.xcarchive" -type d | head -1)
          fi
          
          if [ -z "$XCARCHIVE_DIR" ]; then
            echo "❌ Nessun file .xcarchive trovato!"
            exit 1
          fi
          
          APP_FILE=$(find "$XCARCHIVE_DIR" -name "*.app" -type d | head -1)
          
          if [ -z "$APP_FILE" ]; then
            echo "❌ Nessun file .app trovato!"
            exit 1
          fi
          
          # IMPORTANTE: Modifica Info.plist per forzare accessibilità
          INFO_PLIST="$APP_FILE/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            # Aggiungi tutte le possibili chiavi per accessibilità
            /usr/libexec/PlistBuddy -c "Add :UIAccessibilityEnabled bool YES" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :UIAccessibilityEnabled YES" "$INFO_PLIST"
            
            /usr/libexec/PlistBuddy -c "Add :UIApplicationSupportsIndirectInputEvents bool YES" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :UIApplicationSupportsIndirectInputEvents YES" "$INFO_PLIST"
            
            /usr/libexec/PlistBuddy -c "Add :UISupportsTrueScreenSizeOnTV bool YES" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :UISupportsTrueScreenSizeOnTV YES" "$INFO_PLIST"
            
            # Forza modalità accessibilità
            /usr/libexec/PlistBuddy -c "Add :UIAccessibilityTraits array" "$INFO_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIAccessibilityTraits:0 string UIAccessibilityTraitAllowsDirectInteraction" "$INFO_PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIAccessibilityTraits:1 string UIAccessibilityTraitUpdatesFrequently" "$INFO_PLIST" 2>/dev/null || true
          fi
          
          cp -r "$APP_FILE" build/ipa/Payload/
          
          cd build/ipa
          zip -r AvventuraEpica.ipa Payload/
          rm -rf Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AvventuraEpica-ios-debug
          path: build/ipa/*.ipa