name: Build iOS IPA (Lean)
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          
      - name: Install Python dependencies
        run: |
          pip install flet==0.28.3
          pip install -r requirements.txt
          
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.1"
          
      - name: Setup environment
        run: |
          echo "APP_ENV=prod" > .env
          echo "VERSION=${{ github.run_number }}" >> .env
          echo "BUILD=${{ github.run_number }}" >> .env
          echo "is_mobile=1" >> .env
          
          
      - name: Build IPA with Flet
        run: |
          flet build ipa \
            --project "avventura-epica" \
            --product "Avventura Epica" \
            --build-version "2.5.0" \
            --build-number ${{ github.run_number }} \
            --org "com.ambrogio.riili" \
            --company "Ambrogio Riili" \
            --flutter-build-args=--debug \
            --flutter-build-args=--split-debug-info=debug_info \
            --flutter-build-args=--obfuscate \
            --info-plist "UIAccessibilityEnabled=True" \
            --info-plist "UIAccessibilityTraits=True"
            
      - name: Convert xcarchive to IPA
        run: |
          # Converti xcarchive in IPA non firmato (compatibile con AltStore)
          mkdir -p build/ipa/Payload
          
          echo "🔍 Esplorando struttura xcarchive..."
          echo "📁 Contenuto build/ipa/:"
          ls -la build/ipa/
          
          # Trova dinamicamente l'xcarchive (potrebbe essere Runner.xcarchive o altro)
          XCARCHIVE_DIR=$(find build/ipa -name "*.xcarchive" -type d | head -1)
          
          if [ -z "$XCARCHIVE_DIR" ]; then
            echo "❌ Nessun file .xcarchive trovato!"
            echo "📁 Contenuto completo build/ipa/:"
            ls -la build/ipa/
            exit 1
          fi
          
          echo "✅ Trovato xcarchive: $XCARCHIVE_DIR"
          echo "📁 Contenuto xcarchive:"
          find "$XCARCHIVE_DIR" -type d -maxdepth 3
          echo "📱 Cercando file .app in tutta la struttura:"
          find "$XCARCHIVE_DIR" -name "*.app" -type d
          
          # Cerca il file .app nell'xcarchive trovato
          APP_FILE=$(find "$XCARCHIVE_DIR" -name "*.app" -type d | head -1)
          
          if [ -z "$APP_FILE" ]; then
            echo "❌ Nessun file .app trovato nell'xcarchive!"
            echo "📁 Struttura completa xcarchive:"
            find "$XCARCHIVE_DIR" -type f | head -20
            exit 1
          fi
          
          echo "✅ Trovato app file: $APP_FILE"
          cp -r "$APP_FILE" build/ipa/Payload/
          
          cd build/ipa
          zip -r AvventuraEpica.ipa Payload/
          rm -rf Payload
          
      - name: Validate IPA (quick check)
        run: |
          cd build/ipa
          
          # Verifica esistenza IPA
          if [ ! -f "AvventuraEpica.ipa" ]; then
            echo "❌ IPA file not found"
            exit 1
          fi
          
          # Estrai per controlli base
          unzip -q AvventuraEpica.ipa
          
          # Verifica struttura (cerca dinamicamente il file .app)
          APP_IN_PAYLOAD=$(find Payload/ -name "*.app" -type d | head -1)
          if [ -z "$APP_IN_PAYLOAD" ]; then
            echo "❌ Invalid IPA structure - no .app found in Payload"
            echo "📁 Contenuto Payload:"
            ls -la Payload/
            exit 1
          fi
          
          echo "✅ Found app in payload: $APP_IN_PAYLOAD"
          
          echo "✅ IPA structure valid"
          echo "📱 App size: $(ls -lh AvventuraEpica.ipa | awk '{print $5}')"
          
          # Pulisci
          rm -rf Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AvventuraEpica-ios-lean
          path: build/ipa/*.ipa
 