name: Build iOS IPA (Lean)
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          
      - name: Install Python dependencies
        run: |
          pip install flet==0.28.3
          pip install -r requirements.txt
          
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.1"
          
      - name: Setup environment
        run: |
          echo "APP_ENV=prod" > .env
          echo "VERSION=${{ github.run_number }}" >> .env
          echo "BUILD=${{ github.run_number }}" >> .env
          echo "is_mobile=1" >> .env
          
      # NUOVO: Pulisci cache Flutter e dipendenze
      - name: Clean Flutter cache
        run: |
          cd build
          flutter clean || true
          flutter pub cache clean || true
          
      - name: Build IPA with Flet
        run: |
          # MODIFICHE CHIAVE:
          # 1. Rimuovi --flutter-build-args completamente per usare default
          # 2. Aggiungi più info-plist per accessibilità
          # 3. Usa --no-tree-shake-icons per evitare ottimizzazioni aggressive
          
          flet build ipa \
            --project "avventura-epica" \
            --product "Avventura Epica" \
            --build-version "2.5.0" \
            --build-number ${{ github.run_number }} \
            --org "com.ambrogio.riili" \
            --company "Ambrogio Riili" \
            --info-plist "UIAccessibilityEnabled=YES" \
            --info-plist "UIAccessibilityTraits=UIAccessibilityTraitAllowsDirectInteraction" \
            --info-plist "CFBundleAllowMixedLocalizations=YES" \
            --info-plist "UIViewControllerBasedStatusBarAppearance=NO" \
            --flutter-build-args="--no-tree-shake-icons"
            
      # ALTERNATIVA 1: Prova con modalità debug-like ma ottimizzata
