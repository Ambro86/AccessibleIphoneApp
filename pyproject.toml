[project]
name = "avventura-epica"
version = "2.5.0"
description = "Un'avventura incrementale epica con compagni gatti"
authors = [
    {name = "Ambrogio Riili", email = "ambro86@gmail.com"}
]
dependencies = [
    "flet>=0.28.3",
    "flet-audio>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.flet]
# Configurazione specifica per Flet
app_name = "Avventura Epica"
app_description = "Un gioco di avventura incrementale con gatti compagni, reliquie antiche e mondi da esplorare"
company = "Ambrogio Riili"
org = "com.ambrogio.riili"
product = "Avventura Epica"
version = "2.5.0"

# Configurazioni iOS
[tool.flet.ios]
bundle_id = "com.ambrogio.riili.avventura-epica"
app_name = "Avventura Epica"

# Configurazioni Android  
[tool.flet.android]
package_name = "com.ambrogio.riili.avventura_epica"
app_name = "Avventura Epica"